[project]
name = "harvey-lab"
version = "0.1.0"
description = "A Stirrup-harnessed legal agent on Harvey's Legal Agent Benchmark (LAB), with local rubric evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "rilixai" }]
dependencies = [
  # Stirrup — Artificial Analysis' agent harness the LAB-AA leaderboard
  # runs on; supplies the tool-use loop + LLM routing. The litellm extra
  # pulls in the multi-provider client the task model is routed through.
  "stirrup[litellm]>=0.2.0",
  "litellm>=1.74",
  # litellm lazy-imports tenacity for its retry wrapper but doesn't declare it.
  "tenacity>=8.0",
  # The agent's structured tool-parameter models use pydantic directly.
  "pydantic>=2,<3",
  # Heavy document parsers — lazy-imported by `workspace.extract_text`, which
  # turns the agent's (possibly binary) deliverables into the text the rubric
  # judge grades. Hermetic tests stage plain text and never pay the import cost.
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  # Agent-runtime document extractors mentioned in the task prompt.  These are
  # lazy-imported inside the sandbox but must be importable from the agent's
  # shell environment (i.e. the same Python the harness runs in).
  "pdfplumber>=0.11",
  # Install all optional converters so `markitdown <path>` works for .docx,
  # .xlsx, .pptx, and .pdf files in the agent shell.
  "markitdown[all]>=0.1",
  # Beaker SDK — the `beaker` CLI plus the `@spec` decorator this recipe's
  # optimization spec is authored against. A runtime dependency (not dev-only)
  # so the spec stays importable inside the hosted run's image.
  "beaker-sdk>=0.3.6",
]

[project.scripts]
harvey-lab = "harvey_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Standard src layout: the importable package lives at ``src/harvey_lab``.
# hatchling ships everything under it, including the frozen ``splits/*.txt``
# task-id lists that ``data.read_split`` loads at runtime.
[tool.hatch.build.targets.wheel]
packages = ["src/harvey_lab"]

# Dev tooling + lint/type/test config live in this recipe's own pyproject so
# the folder is a self-contained project.

[dependency-groups]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W", "UP006", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["harvey_lab"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
files = ["src/harvey_lab"]

# ``ignore_missing_imports`` for the agent/parser deps that ship without
# ``py.typed`` markers.
[[tool.mypy.overrides]]
module = [
  "stirrup",
  "stirrup.*",
  "litellm",
  "openpyxl",
  "docx",
  "pptx",
]
ignore_missing_imports = true
