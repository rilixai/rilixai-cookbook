name: checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, so a breaking upstream release is caught by tests-latest-deps.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lint, format, type-check, and verify each recipe builds cleanly. Each
  # recipe is its own standalone uv project (its own pyproject + uv.lock), so
  # the matrix runs the checks independently per recipe directory. Split from
  # the pytest job so a lint regression fails fast without waiting for pytest,
  # and vice versa.
  checks:
    name: Lint, type-check, and build (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      # ``--locked`` fails the job if this recipe's uv.lock is stale vs its
      # pyproject — catches "forgot to ``uv lock`` after editing pyproject"
      # before it bites a downstream consumer of the cookbook template.
      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy
        # ``[tool.mypy] files`` in this recipe's pyproject.toml scopes this to
        # the recipe's source (tests + scripts excluded).
        run: uv run python -m mypy

      # Build the recipe's wheel without ``[tool.uv.sources]`` overrides so
      # packaging regressions surface here rather than in a downstream "copy
      # this template" user's environment.
      - name: Build distribution
        run: uv build --no-sources

  tests:
    name: Pytest (${{ matrix.recipe }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      - name: uv sync (locked)
        run: uv sync --group dev --locked

      - name: pytest
        run: uv run python -m pytest -q

  # A hosted Beaker image is built by pip-installing a recipe's pyproject
  # *without* its uv.lock, so it resolves the newest versions the declared
  # ranges allow. The jobs above are ``--locked`` and therefore blind to a
  # breaking upstream release: stirrup 0.2.0 made a required argument out of
  # `LiteLLMClient(context_window_tokens=...)` and every hosted rollout died on
  # it while CI stayed green. This job resolves fresh, daily, so the next such
  # release surfaces here instead of in a run.
  tests-latest-deps:
    name: Pytest, newest allowed deps (${{ matrix.recipe }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        recipe: [harvey_lab, hotpotqa, apex_agents]
    defaults:
      run:
        working-directory: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install

      - name: uv sync (newest allowed versions, ignoring uv.lock)
        run: uv sync --group dev --upgrade --resolution highest

      - name: pytest
        run: uv run python -m pytest -q
